name: Update court tracker
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check files are in place
        run: |
          for f in update.js sources.json data.json index.html; do
            if [ ! -f "$f" ]; then echo "MISSING FILE: $f must be at the top level of the repository"; exit 1; fi
          done
      - name: Fetch court updates
        run: node update.js
      - name: Save results
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update data $(date -u +%FT%TZ)" && git push)
